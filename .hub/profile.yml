name: honsha
description: A workflow for running software projects with AI agents, packaged as a Claude Code plugin.
language: en
stack: [node]
default-branch: main
merge-deploys: false
public: true
# The static security testing is oxlint's security rules in `.oxlintrc.json` and three commands of
# `checks/security-testing.mjs`: secrets over the branch's commits, and the workflow files twice, by actionlint with
# ShellCheck on the scripts of their steps and by zizmor. The one shell script the kit tracks, `.githooks/pre-push`,
# only hands its arguments to Node.js, so ShellCheck reads the kit's shell in those steps. No `dynamic-testing`: the
# kit serves no HTTP.
verify:
  - npx --no-install prettier --check .
  - npx --no-install oxlint
  - npx --no-install tsc -p .
  - node --test "hooks/*.test.mjs" "checks/*.test.mjs" "hub/*.test.mjs" "services/*/*.test.mjs"
  - node checks/security-testing.mjs gitleaks
  - node checks/security-testing.mjs actionlint
  - node checks/security-testing.mjs zizmor
  - claude plugin validate .
  - node checks/record.mjs
  - node checks/commits.mjs
setup:
  - npm ci --ignore-scripts
  - node checks/security-testing.mjs --setup
# The files that guard, the workflow files, and those of the security review and testing with their tools'
# configuration: a change to any of them calls for the security review.
security-review:
  - hooks/guard.mjs
  - hooks/hooks.json
  - services/github/merge-commands.json
  - checks/public.mjs
  - checks/pushed.mjs
  - .githooks/pre-push
  - .claude/settings.json
  - agents/security-reviewer.md
  - skills/security-review/SKILL.md
  - skills/security-testing/SKILL.md
  - skills/security-posture/SKILL.md
  - checks/history-secrets.mjs
  - checks/releases.mjs
  - checks/security-testing.mjs
  - .oxlintrc.json
  - .gitleaksignore
  - .github/workflows/*
  - .github/actionlint.*
  - .github/zizmor.*
  - zizmor.*
gates:
  - the rules name no hosting service
  - nothing about a user, a user's project or an installation
  - a script comes with its test
  - a document of the kit cites no entry of a decision log: it states the rule, with its reason where the reason helps
always-full:
  - docs/01-specs/INTERFACE.md
kinds: # the most existing files a change of each kind is expected to touch
  gate: 1
  rule: 3
  flow: 3
  capability: 3
  fix: 4
  upkeep: 6
commits:
  address: '@users\.noreply\.github\.com$'
lessons: LESSONS.md
