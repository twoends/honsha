name: honsha
description: A workflow for running software projects with AI agents, packaged as a Claude Code plugin.
language: en
stack: [node]
default-branch: main
merge-deploys: false
verify:
  - npx --no-install prettier --check .
  - npx --no-install oxlint
  - npx --no-install tsc -p .
  - node --test "hooks/*.test.mjs" "checks/*.test.mjs" "services/*/*.test.mjs"
  - claude plugin validate .
  - node checks/commits.mjs
gates:
  - the rules name no hosting service
  - nothing about a user, a user's project or an installation
  - a script comes with its test
kinds: # the most existing files a change of each kind is expected to touch
  gate: 1
  rule: 3
  flow: 3
  capability: 3
  fix: 4
  upkeep: 6
commits:
  address: '@users\.noreply\.github\.com$'
lessons: LESSONS.md
