name: honsha
description: A workflow for running software projects with AI agents, packaged as a Claude Code plugin.
language: en
stack: [node]
default-branch: main
merge-deploys: false
public: true
verify:
  - npx --no-install prettier --check .
  - npx --no-install oxlint
  - npx --no-install tsc -p .
  - node --test "hooks/*.test.mjs" "checks/*.test.mjs" "hub/*.test.mjs" "services/*/*.test.mjs"
  - claude plugin validate .
  - node checks/record.mjs
  - node checks/commits.mjs
setup:
  - npm ci --ignore-scripts
gates:
  - the rules name no hosting service
  - nothing about a user, a user's project or an installation
  - a script comes with its test
  - a document of the kit cites no entry of a decision log: it states the rule, with its reason where the reason helps
always-full:
  - docs/01-specs/INTERFACE.md
kinds: # the most existing files a change of each kind is expected to touch
  gate: 1
  rule: 3
  flow: 3
  capability: 3
  fix: 4
  upkeep: 6
commits:
  address: '@users\.noreply\.github\.com$'
lessons: LESSONS.md
