# Prepares a project's checkout with its profile's `setup` commands, then runs the kit's checks and the project's
# `verify` and `dynamic-testing` commands, on the project's pull requests and on each push to its default branch. A
# later push to a pull request that changes only records, after a run that passed, gets the kit's checks alone.
#
# A project's own workflow calls this one; the caller file is shown in services/github/README.md,
# under "Checks on pull requests and on the default branch", and what the wiring has to do is the
# contract (workflow, Checks on pull requests and on the default branch). The commands are the ones
# the worker runs in a new worktree and at its verification (agents/worker.md); they are not repeated
# here beyond their order.

name: project

on:
  workflow_call:
    inputs:
      claude-code:
        description: The version of Claude Code to install, for a profile that runs `claude`; none when empty.
        type: string
        required: false
        default: ""
      npm:
        description: The npm version to install before the setup, for a project that asks another npm; none when empty.
        type: string
        required: false
        default: ""

# No permissions here: the token holds what the caller grants, `contents: read` and, for the skip on records,
# `actions: read`. A called workflow may only keep or lower its caller's permissions, and one that named
# `actions: read` would ask more than a caller that has not added it grants.

# No concurrency group here: the caller's own group covers this run, and the same group in the
# called workflow would cancel the run already going.

jobs:
  checks:
    # Linux only: the second system of the kit's own matrix tests the kit, not a project.
    runs-on: ubuntu-latest
    # Without a limit a stuck command spends the account's minutes for six hours.
    timeout-minutes: 20
    # On a push to the default branch, the range is what that push added: the merges and the backlog's direct
    # commits, which no pull request checks.
    env:
      HONSHA_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      HONSHA_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
      HONSHA_HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
    defaults:
      run:
        working-directory: project
    steps:
      # The project and the kit sit side by side, so that the project's own commands, such as a
      # formatter run on `.`, never read the kit's files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      # The kit at the commit this file was read from, so that the checks and their wiring always
      # match; a project's caller names the kit's default branch, as its sessions use it. The
      # caller's own token reads it: a token reads its own repository and any public one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # A later push to a pull request whose commits change only records needs neither the setup nor the verification
      # and dynamic testing commands once the run on the branch's earlier tip passed: that run checked the same code,
      # and the kit's checks below still read the records. The opening of a pull request has no earlier tip, and the
      # default branch is checked in full at every push: it is where whatever the skip leaves out is caught. Only both
      # scripts' exit code 0 writes `false`; a failure of either, like a skipped step, leaves the output empty, and
      # every step runs.
      # The actions above take the token as an input; of the steps that run commands, this one alone gets it, in its
      # environment and before any of the project's commands runs. Code in the job can still read it from the runner's
      # memory, so what it may do is what the job may do.
      - name: Tell whether the push changes more than records
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if node ../kit/checks/changes.mjs "$BEFORE" "$HONSHA_HEAD" &&
            node ../kit/services/github/runs.mjs "$BEFORE" "$HONSHA_BRANCH"; then
            echo "verify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Records only, after a run that passed: the setup, the verification and the dynamic testing are left out."
          fi
      # Before the setup, whose first `npm ci` refuses an npm outside the project's `devEngines`.
      - name: Install npm
        if: inputs.npm != '' && steps.changes.outputs.verify != 'false'
        env:
          VERSION: ${{ inputs.npm }}
        # Outside the lockfile, which holds the project's packages and not the package manager, at the version that
        # the caller names.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global "npm@$VERSION"
          npm --version
      # The profile says what a fresh checkout of the project needs, wherever its packages are: the pipeline installs
      # none of the project's packages itself.
      - name: Prepare the checkout with the setup commands of the profile
        if: steps.changes.outputs.verify != 'false'
        run: node ../kit/checks/verify.mjs --setup
      - name: Install Claude Code
        if: inputs.claude-code != '' && steps.changes.outputs.verify != 'false'
        env:
          VERSION: ${{ inputs.claude-code }}
        # The package's `postinstall` fetches the native binary; npm 12 runs no install script that `allow-scripts` does
        # not name. Outside the lockfile, as `honsha:dependencies` has a pipeline install Claude Code, at the version
        # that the caller names.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global --allow-scripts=@anthropic-ai/claude-code "@anthropic-ai/claude-code@$VERSION"
      - name: Check the record of the work item
        if: github.event_name == 'pull_request'
        run: node ../kit/checks/record.mjs
      - name: Check the commits of the branch
        run: node ../kit/checks/commits.mjs
      - name: Check the registry of the projects
        if: hashFiles('project/registry.yml') != ''
        run: node ../kit/hub/projects.mjs check
      - name: Run the verification commands of the profile
        if: steps.changes.outputs.verify != 'false'
        run: node ../kit/checks/verify.mjs
      # After the verification, so that a change that fails it spends no minutes on an instance. The commands start a
      # local instance from this checkout and attack it, with the runner's container engine; a profile without them
      # passes at once. Its environment holds no secret and no token, but the project's code that it runs can read the
      # token from the runner's memory, as that of the verification can.
      - name: Run the dynamic testing commands of the profile
        if: steps.changes.outputs.verify != 'false'
        run: node ../kit/checks/verify.mjs --dynamic
