# Runs the kit's verification commands, and the workflow that projects call, on the kit itself: on every pull request
# to the default branch and on every push to it.
#
# This file is the GitHub wiring of the checks: what it has to do is in docs/01-specs/WORKFLOW.md,
# section 14.2, and how it does it on GitHub is in services/github/README.md. The commands are
# the `verify` list of .hub/profile.yml; they are not repeated here.

name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer run of a pull request cancels its older one. A push has no number: its group is its commit, so that no push
# cancels another, since each run checks only what its push added.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# On a push to the default branch, the range is what that push added: its merges, which no pull request checks
# together. A called workflow takes none of these; project.yml sets its own.
env:
  HONSHA_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
  HONSHA_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
  HONSHA_HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node.js 26 is the kit's lowest version; the two systems are the host's and the one the kit is built on.
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the development tools from the lockfile, without install scripts
        run: npm ci --ignore-scripts
      - name: Install Claude Code, for the plugin validator
        run: npm install --global @anthropic-ai/claude-code@2.1.325
      - name: Run the verification commands of the profile
        run: node checks/verify.mjs

  # The workflow every project calls runs here on the kit's own pull requests and pushes, so that both of its paths
  # are known to run before a project relies on them. Called from this repository, it reads the kit with this
  # repository's own token, whatever the repository's visibility.
  project:
    uses: ./.github/workflows/project.yml
    with:
      # The profile runs `claude plugin validate .`; the same version as the job above.
      claude-code: "2.1.325"
