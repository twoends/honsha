# Runs the kit's verification commands, the workflow that projects call and the check of personal content on the kit
# itself: on every pull request to the default branch and on every push to it.
#
# This file is the GitHub wiring of the checks: what it has to do is the contract
# (workflow, Checks on pull requests and on the default branch), and how it does it on GitHub is in
# services/github/README.md. The commands are the `verify` list of .hub/profile.yml; they are not
# repeated here.

name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer run of a pull request cancels its older one. A push has no number: its group is its commit, so that no push
# cancels another, since each run checks only what its push added.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# On a push to the default branch, the range is what that push added: its merges, which no pull request checks
# together. A called workflow takes none of these; project.yml sets its own.
env:
  HONSHA_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
  HONSHA_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
  HONSHA_HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node.js 26 is the kit's lowest version; the two systems are the host's and the one the kit is built on.
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # On, the cache would take the npm of the `devEngines` of package.json for the project's and ask the npm of
          # Node.js for its folder: that npm refuses `devEngines`, before the step below installs npm 12.
          package-manager-cache: false
      # Before the setup, whose `npm ci` refuses an npm outside the `devEngines` of package.json. Bash on both systems,
      # since PowerShell would fail the step only on the exit code of its last command.
      - name: Install the npm that package.json asks
        shell: bash
        run: |
          npm install --global npm@12.2.2
          npm --version
      - name: Prepare the checkout with the setup commands of the profile
        run: node checks/verify.mjs --setup
      - name: Install Claude Code, for the plugin validator
        # The package's `postinstall` fetches the native binary; npm 12 runs no install script that `allow-scripts` does
        # not name.
        run: npm install --global --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.325
      - name: Run the verification commands of the profile
        run: node checks/verify.mjs

  # The kit is public, and its hook checks a push only in a clone that has it: here every commit of the range is
  # checked again, the merges GitHub writes included. By the patterns only, since the system's user is the runner's;
  # the name of the machine's user stays with the hook. One system is enough: the check reads git's output.
  personal:
    name: personal content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # As in the job above: on, the cache would run the npm of Node.js, which refuses the `devEngines` of
          # package.json. This job installs nothing.
          package-manager-cache: false
      - name: Check each commit of the range for personal content
        run: node checks/pushed.mjs --range

  # The workflow every project calls runs here on the kit's own pull requests and pushes, so that both of its paths
  # are known to run before a project relies on them. Called from this repository, it reads the kit with this
  # repository's own token, whatever the repository's visibility.
  project:
    uses: ./.github/workflows/project.yml
    with:
      # The profile runs `claude plugin validate .`; the same version as the job above.
      claude-code: "2.1.325"
      # The npm that the kit's `devEngines` asks; the same version as the job above.
      npm: "12.2.2"
