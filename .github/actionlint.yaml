# The configuration of actionlint, which `checks/security-testing.mjs actionlint` runs on the workflow files.
paths:
  .github/workflows/project.yml:
    ignore:
      # GitHub gives a job the context `job.workflow_repository` and `job.workflow_sha`, the repository and the commit
      # of the workflow file that runs, which the pinned actionlint does not know yet: the kit's pipeline runs the file
      # with them on every pull request.
      - 'property "workflow_(repository|sha)" is not defined in object type'
