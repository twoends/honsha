# The profile of a project: this file, filled in, at `.hub/profile.yml` in the project's root. A key left out takes
# the default its comment names, where it has one. `checks/profile.mjs` reads the keys the kit's scripts use and
# refuses a form it cannot read. The values below are examples.
# The project's name, the one the home's registry gives it.
name: example-project
# The language of the project's documents and records (core rules, Work items). English when left out.
language: en
# The technologies whose lessons the project's sessions load from the home (workflow, Lessons). It names files of the
# home, so each is a plain name: letters, digits and `.+-_`.
stack: [node, postgres, docker]
# The branch that changes only through pull requests. Left out, the kit's scripts take `main` or `master`.
default-branch: main
# True when the project's repository is public, which the kit cannot learn from a hosting service: its records then
# restate the request and quote nothing the person said (core rules, The record). Left out, the project is private.
public: false
# Each area of the project, with its paths; an item's areas are proposed from them. An area can have a pack of rules,
# the skill `honsha:area-<name>` of the kit, which a session that works on an item of that area loads before it
# changes anything; an area without a pack has no extra rules.
areas:
  backend: { paths: ["src/**"] }
  deploy: { paths: ["deploy/**", ".github/**"] }
  content: { paths: ["prompts/**"] }
# The verification commands, one on each line, as a list: the kit's scripts read no other form. Each runs in the
# machine's default shell. Together they cover five things, with the tools of the project's own stack: formatting,
# lint, types where the language has them, tests, and the static security testing that `honsha:security-testing` asks
# of the project; one command may cover several, as `npm run check` does here. A project that leaves one out says why
# in a comment beside the list. The checker reports what the list does not cover.
verify:
  - npm run check
# The dynamic security testing of a project that serves HTTP (`honsha:security-testing`): commands that start a local
# instance from the checkout and attack it from outside, which every verification runs after `verify`, in the same list
# form and default shell. Left out, there is none.
dynamic-testing:
  - docker compose -f compose.scan.yml up --abort-on-container-exit --exit-code-from scanner
# The commands that prepare a fresh checkout for `verify`, `dynamic-testing` and the project's own git hooks, in the
# same list form and the same default shell: `checks/verify.mjs --setup` runs them once in each new checkout, an item's
# worktree or the pipeline's. Left out, nothing is installed. An install runs its packages' scripts unless told not to.
setup:
  - npm ci --ignore-scripts
# The project's quality gates. The checker reports each as met, not met or not verifiable.
gates:
  - tests added or updated
  - no breaking change without approval
# Paths whose change makes an item full, beside the cases the core rules list (Sizes).
always-full:
  - "db/migrations/**"
# Paths whose change calls for the security review before delivery, beside the cases the skill
# `honsha:security-review` names. `*` stays inside a folder, `**` crosses folders, and both match a name that begins
# with a dot. Left out, only those cases call for it.
security-review:
  - "src/auth/**"
# The kinds of change, chosen with an item's size, each with the most existing files a change of that kind is expected
# to touch (workflow, Measures). Left out: feature 10, fix 5, upkeep 5, change 10.
kinds:
  feature: 10
  fix: 5
  upkeep: 5
# A regular expression that the author's and the committer's address of every commit on a work branch must match.
# Left out, no rule on addresses. Best in single quotes, where YAML keeps a backslash as it is.
commits:
  address: '@example\.org$'
# How many workers may run in the project at once, and the resources only one worker may use at a time
# (`honsha:parallel-parts`).
parallel:
  max: 2
  exclusive: [integration-db]
# The file, inside the project, that holds the lessons about this repository only; its name is the project's choice.
lessons: LESSONS.md
